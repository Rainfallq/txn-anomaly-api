# Local Jenkins for learning. Do not expose this setup to the internet:
# it runs as root and can control the Docker engine of the host.
services:
  jenkins:
    build: .
    container_name: jenkins
    user: root
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
